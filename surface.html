<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Big Brother</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mona+Sans:wght@400..700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400..700&display=swap">
<style>
/* same look as the dashboard: dark panels, lime voice, blue glow while thinking */
:root{
  color-scheme:dark;
  --bg:#0a0a0a; --panel:#111111; --raise:#181818; --line:#1e1e1e; --line-2:#2b2b2b;
  --ink:#e8e8e3; --muted:#8c8c86; --dim:#56564f;
  --lime:#e1f24a; --lime-text:#e1f24a; --lime-ink:#151700; --think:#5b78ff; --warn:#ff5c5c;
  --accepted:#43d672; --bad_timing:#f5a63b; --bad_content:#a88cff;
  --glow:radial-gradient(120% 140% at 50% 120%,#3553ff 0%,#1b2bb0 35%,#0d1766 65%,#070b2b 100%);
  --pixel:"Pixelify Sans","Courier New",monospace;
  --mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --sans:"Mona Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
:root[data-theme="light"]{   /* VS Code light themes pass ?theme=light */
  color-scheme:light;
  --bg:#f5f5f2; --panel:#ffffff; --raise:#f0f0ec; --line:#e2e2dc; --line-2:#d3d3cc;
  --ink:#16160f; --muted:#62625b; --dim:#8f8f87;
  --lime-text:#5b6600; --think:#2f4dff; --warn:#d63b3b;
  --accepted:#23884a; --bad_timing:#b86e0c; --bad_content:#6a4fd6;
  --glow:radial-gradient(120% 140% at 50% 120%,#c3ceff 0%,#e3e8ff 50%,#ffffff 100%);
}
*{box-sizing:border-box}
[hidden],#card:empty,#toast:empty{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 var(--sans)}
.embed body{background:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid var(--lime-text);outline-offset:2px}
.wrap{max-width:440px;margin:0 auto;padding:10px 10px 18px;display:grid;gap:8px}

/* presence */
.presence{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;transition:background .4s}
.mode-considering.presence{background:var(--glow);border-color:rgba(91,120,255,.45)}
.dot{position:relative;flex:none;width:10px;height:10px;border-radius:50%;background:var(--dim)}
.dot::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid transparent}
.mode-watching .dot{background:var(--dim)}
.mode-considering .dot{background:var(--think);box-shadow:0 0 12px var(--think);animation:breathe 1.6s ease-in-out infinite}
.mode-ready .dot,.mode-open .dot{background:var(--lime);box-shadow:0 0 12px var(--lime)}
.mode-ready .dot::after{border-color:var(--lime);animation:ring 1.8s ease-out 2}
.mode-snoozed .dot{background:none;border:2px solid var(--dim)}
.mode-offline .dot{background:var(--warn)}
@keyframes breathe{50%{opacity:.4;transform:scale(.8)}}
@keyframes ring{from{opacity:.9;transform:scale(.6)}to{opacity:0;transform:scale(1.8)}}
@media (prefers-reduced-motion:reduce){.dot,.dot::after{animation:none!important}.presence{transition:none}}
.txt{flex:1;min-width:0}
.title{font:500 17px/1.25 var(--pixel);letter-spacing:.01em}
.mode-ready .title,.mode-open .title{color:var(--lime-text)}
.mode-considering .title{color:#eef1ff}
:root[data-theme="light"] .mode-considering .title{color:var(--ink)}
.sub{margin-top:2px;font:11.5px/1.45 var(--mono);color:var(--muted)}
.mode-considering .sub{color:#b3bfff}
:root[data-theme="light"] .mode-considering .sub{color:var(--muted)}
.btn{border:1px solid var(--line-2);background:var(--raise);border-radius:7px;padding:6px 10px;white-space:nowrap;
     font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.btn:hover:not(:disabled){border-color:var(--muted)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--lime);border-color:var(--lime);color:var(--lime-ink)}
.btn.primary:hover{filter:brightness(1.06)}

/* the thought */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px 14px}
.card-top{display:flex;align-items:center;gap:8px;font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card-top > span{display:inline-flex;align-items:center;gap:7px;padding:3px 8px;border:1px solid var(--line-2);border-radius:6px;background:var(--raise)}
.card-top > span::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--lime)}
.card-top .x{margin-left:auto;border:0;background:none;padding:2px 7px;border-radius:6px;font:16px/1 var(--mono);color:var(--muted)}
.card-top .x:hover{background:var(--raise);color:var(--ink)}
.content{margin:12px 0;padding-left:12px;border-left:3px solid var(--lime);font-size:14.5px;line-height:1.5}
code{font-family:var(--mono);font-size:.88em;background:var(--raise);border:1px solid var(--line-2);border-radius:4px;padding:0 4px}
.why{background:var(--raise);border-radius:8px;padding:9px 11px;font-size:12.5px;color:var(--muted)}
.why b{display:block;margin-bottom:3px;font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.sigs{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.sig{font:600 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--lime-text);border:1px solid var(--line-2);border-radius:4px;padding:1px 6px}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.actions .btn{background:none;border-color:var(--c);color:var(--c)}
.actions .btn:hover:not(:disabled){background:var(--raise)}
.more{margin-top:10px;font:11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}

.toast{padding:0 4px;font:11.5px var(--mono);color:var(--muted)}

/* missed help */
.help{border-top:1px solid var(--line);padding-top:10px}
.link{border:0;background:none;padding:0;font:11.5px var(--mono);letter-spacing:.04em;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--ink)}
.help form{display:grid;gap:6px;margin-top:8px}
textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;resize:vertical;min-height:56px}
.row{display:flex;gap:6px;justify-content:flex-end}
.foot{display:flex;justify-content:space-between;gap:8px;font:10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.foot a{color:inherit}
.foot a:hover{color:var(--ink)}

/* on/off switch: always in reach at the top */
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 4px 0}
.brand{font:600 13px var(--pixel);letter-spacing:.05em}
.switch{display:inline-flex;align-items:center;gap:9px;border:0;background:none;padding:4px 2px;
        font:600 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.switch .rail{position:relative;width:38px;height:22px;border-radius:99px;background:var(--line-2);border:1px solid var(--line-2);transition:background .2s,border-color .2s}
.switch .knob{position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--dim);transition:transform .2s,background .2s}
.switch[aria-checked="true"]{color:var(--lime-text)}
.switch[aria-checked="true"] .rail{background:var(--lime);border-color:var(--lime);box-shadow:0 0 10px rgba(225,242,74,.35)}
.switch[aria-checked="true"] .knob{transform:translateX(16px);background:var(--lime-ink)}
.switch:disabled{opacity:.45;cursor:default}
.mode-paused .dot{background:none;border:2px dashed var(--dim)}
.mode-paused .title{color:var(--muted)}
@media (prefers-reduced-motion:reduce){.switch .rail,.switch .knob{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <span class="brand">BIG BROTHER</span>
    <button id="power" class="switch" type="button" role="switch" aria-checked="true" disabled>
      <span class="state">On</span><span class="rail" aria-hidden="true"><span class="knob"></span></span>
    </button>
  </header>

  <section id="presence" class="presence mode-watching" aria-live="polite">
    <span class="dot" aria-hidden="true"></span>
    <div class="txt"><div class="title">Connecting…</div><div class="sub"></div></div>
    <span id="presence-action"></span>
  </section>

  <div id="card"></div>
  <div id="toast" class="toast" role="status"></div>

  <section class="help">
    <button id="help-toggle" class="link" type="button">Wish I'd spoken up? Tell me</button>
    <form id="help-form" hidden>
      <textarea id="help-note" placeholder="What were you stuck on? (optional)" aria-label="What were you stuck on?"></textarea>
      <div class="row">
        <button class="btn" type="button" id="help-cancel">Cancel</button>
        <button class="btn primary" type="submit">Log a miss</button>
      </div>
    </form>
  </section>

  <div class="foot">
    <span id="tally"></span>
    <a href="/" target="_blank" rel="noopener">Restraint log ↗</a>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
if (params.get("theme")) document.documentElement.dataset.theme = params.get("theme");
if (params.has("embed")) document.documentElement.classList.add("embed");

const EXPIRE_MS = 10 * 60 * 1000;        // unopened thoughts become IGNORED after this
const CONSIDER_STALE_MS = 30 * 1000;     // judge crashed mid-call? stop pulsing
const SNOOZE_MS = 15 * 60 * 1000;
const LABEL = {accepted: "helpful", dismissed: "dismissed", ignored: "ignored",
               bad_timing: "right idea, wrong time", bad_content: "not useful", wanted_help: "a miss"};

const $ = s => document.querySelector(s);
let recs = {decisions: [], feedback: []};
let st = {considering: null, snoozed_until: 0, now: Date.now()};
let skew = 0;                 // server clock minus browser clock
let online = null;
let openId = null;            // thought the developer pulled up
const shownAt = {};           // decision_id -> ms it first appeared as "ready" here
const sending = new Set();    // decision_ids with feedback in flight
let lastKey = "";

function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "style") n.style.cssText = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) n.append(c.nodeType ? c : String(c));
  return n;
}
const now = () => Date.now() + skew;
const human = s => s ? s.replace(/_/g, " ").replace(/^./, c => c.toUpperCase()) : "";
const clock = ms => new Date(ms).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
const rich = text => (text || "").split(/(`[^`]+`)/).map(p =>
  p.length > 1 && p.startsWith("`") && p.endsWith("`") ? el("code", {}, p.slice(1, -1)) : p);

function currentSession() {
  if (params.get("session")) return params.get("session");
  let best = null, bestTs = -1;
  for (const r of recs.decisions) if (r.decision.ts > bestTs) { bestTs = r.decision.ts; best = r.session_id; }
  return best;
}

function sessionData() {
  const s = currentSession();
  const ds = recs.decisions.filter(r => r.session_id === s).sort((a, b) => a.decision.ts - b.decision.ts);
  const answered = new Set(recs.feedback.filter(f => f.session_id === s && f.decision_id).map(f => f.decision_id));
  const pending = ds.filter(r => {
    const id = r.decision.decision_id;
    if (!r.decision.should_speak || answered.has(id) || sending.has(id)) return false;
    return id in shownAt || now() - r.decision.ts < EXPIRE_MS;
  });
  return {s, ds, pending};
}

function view() {
  if (online === false) return {mode: "offline"};
  if (online === null) return {mode: "connecting"};
  const {ds, pending} = sessionData();
  const spoke = ds.filter(r => r.decision.should_speak).length;
  const base = {quiet: ds.length - spoke, spoke};
  if (st.paused) return {...base, mode: "paused"};
  if (st.snoozed_until > now()) return {...base, mode: "snoozed"};
  const open = pending.find(r => r.decision.decision_id === openId);
  if (open) return {...base, mode: "open", rec: open, more: pending.length - 1};
  if (pending.length) return {...base, mode: "ready", rec: pending[pending.length - 1], more: pending.length - 1};
  const c = st.considering;
  if (c && now() - c.since < CONSIDER_STALE_MS) return {...base, mode: "considering"};
  return {...base, mode: "watching"};
}

function render() {
  const v = view();
  if (v.mode === "ready" || v.mode === "open")
    for (const r of sessionData().pending) shownAt[r.decision.decision_id] ??= now();

  $("#tally").textContent = !v.quiet && !v.spoke ? "No moments yet"
                                                 : `Stayed quiet ${v.quiet}× · spoke ${v.spoke}×`;
  const power = $("#power");
  power.disabled = online !== true;
  power.setAttribute("aria-checked", String(!st.paused));
  power.setAttribute("aria-label", st.paused ? "Assistant paused. Turn on" : "Assistant on. Pause");
  power.querySelector(".state").textContent = st.paused ? "Paused" : "On";
  const key = [v.mode, v.rec && v.rec.decision.decision_id, v.more, v.quiet, st.snoozed_until, st.paused].join("|");
  if (key === lastKey) return;
  lastKey = key;

  const p = $("#presence");
  p.className = "presence mode-" + v.mode;
  const [title, sub, action] = presenceText(v);
  p.querySelector(".title").textContent = title;
  p.querySelector(".sub").textContent = sub;
  $("#presence-action").replaceChildren(action || "");
  $("#card").replaceChildren(v.mode === "open" ? card(v.rec, v.more) : "");
}

function presenceText(v) {
  const snooze = el("button", {class: "btn", type: "button", onclick: () => setSnooze(now() + SNOOZE_MS)}, "Snooze 15m");
  switch (v.mode) {
    case "connecting": return ["Connecting…", "", null];
    case "offline": return ["Can't reach the assistant", "Is the mailbox server running on :8766?", null];
    case "paused": return ["Paused", "I won't interrupt you until you turn me back on",
      el("button", {class: "btn primary", type: "button", onclick: () => setPaused(false)}, "Turn on")];
    case "snoozed": return ["Snoozed", `Holding everything until ${clock(st.snoozed_until)}`,
      el("button", {class: "btn", type: "button", onclick: () => setSnooze(0)}, "Resume")];
    case "considering": return ["Considering something…", "Weighing whether it's worth interrupting you", snooze];
    case "ready": {
      const cited = (v.rec.decision.signals_cited || [])[0] || (v.rec.candidate.signals[0] || {}).kind;
      return ["I have a thought", "Ready when you are" + (cited ? ` · about ${human(cited).toLowerCase()}` : ""),
        el("button", {class: "btn primary", type: "button", onclick: () => { openId = v.rec.decision.decision_id; render(); }}, "Show")];
    }
    case "open": return ["Here's what I noticed", "", null];
    default: return ["Watching quietly", "I'll only speak up if it's worth breaking your focus", snooze];
  }
}

function card(r, more) {
  const d = r.decision, id = d.decision_id;
  const signals = r.candidate.signals.filter(s => !(d.signals_cited || []).length || d.signals_cited.includes(s.kind));
  const act = (kind, text) => el("button", {class: "btn", type: "button", style: `--c:var(--${kind})`,
    onclick: () => respond(r, kind)}, text);
  return el("article", {class: "card", "aria-label": "Assistant suggestion"},
    el("div", {class: "card-top"}, el("span", {}, `${clock(d.ts)} · ${Math.round(d.confidence * 100)}% sure`),
      el("button", {class: "x", type: "button", title: "Dismiss", "aria-label": "Dismiss", onclick: () => respond(r, "dismissed")}, "×")),
    el("p", {class: "content"}, rich(d.content)),
    el("div", {class: "why"}, el("b", {}, "Why now: "), rich(d.reasoning),
      signals.length ? el("div", {class: "sigs"}, signals.map(s => el("span", {class: "sig", title: s.detail}, human(s.kind)))) : null),
    el("div", {class: "actions"},
      act("accepted", "Helpful"),
      act("bad_timing", "Right idea, wrong time"),
      act("bad_content", "Not useful")),
    more > 0 ? el("div", {class: "more"}, `${more} more waiting`) : null);
}

async function sendFeedback(sessionId, contractVersion, kind, decisionId, note) {
  const rec = {contract_version: contractVersion || "1.0.0", session_id: sessionId,
               ts: now(), decision_id: decisionId, kind, note: note || null};
  try {
    const r = await fetch("/log", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(rec)});
    return r.ok && (await r.json()).ok;
  } catch { return false; }
}

async function respond(r, kind) {
  const id = r.decision.decision_id;
  sending.add(id);
  if (openId === id) openId = null;
  render();
  const ok = await sendFeedback(r.session_id, r.contract_version, kind, id);
  if (ok) await refresh();
  sending.delete(id);
  toast(ok ? `Logged as ${LABEL[kind]}. Thanks.` : "Couldn't reach the server, so that wasn't logged.");
  render();
}

let toastTimer;
function toast(text) {
  $("#toast").textContent = text;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => $("#toast").textContent = "", 4000);
}

async function setSnooze(until) {
  try {
    const r = await fetch("/snooze", {method: "POST", headers: {"Content-Type": "application/json"},
                                      body: JSON.stringify({until: Math.round(until)})});
    Object.assign(st, await r.json());
  } catch { toast("Couldn't reach the server."); }
  render();
}

// Pause: off until turned back on (a snooze ends by itself). The judge sees it
// through p3_send.snoozed() and stays quiet.
async function setPaused(paused) {
  $("#power").disabled = true;
  try {
    const r = await fetch("/pause", {method: "POST", headers: {"Content-Type": "application/json"},
                                     body: JSON.stringify({paused})});
    const s = await r.json();
    if (!s.ok) throw new Error(s.error);
    Object.assign(st, s);
    if (paused) openId = null;
    toast(paused ? "Paused. I'll stay quiet until you turn me back on." : "Back on. Watching quietly.");
  } catch { toast("Couldn't reach the server."); }
  render();
}

// Thoughts that sat unopened past EXPIRE_MS are logged as IGNORED, but only
// ones this surface actually displayed — never ones it never showed.
async function expireIgnored() {
  const {pending} = sessionData();
  for (const r of pending) {
    const id = r.decision.decision_id;
    if (id !== openId && id in shownAt && now() - shownAt[id] > EXPIRE_MS) await respond(r, "ignored");
  }
}

// Only what changed since the last answer; "full" means start over (server restarted).
let boot = "", rev = 0, inflight = null;
const fbKey = f => `${f.decision_id}|${f.kind}|${f.ts}`;

function merge(d) {
  if (d.full) { recs = {decisions: d.decisions, feedback: d.feedback}; return; }
  const index = new Map(recs.decisions.map((r, i) => [r.decision.decision_id, i]));
  for (const r of d.decisions) {
    const i = index.get(r.decision.decision_id);
    if (i === undefined) recs.decisions.push(r); else recs.decisions[i] = r;
  }
  const have = new Set(recs.feedback.map(fbKey));
  recs.feedback.push(...d.feedback.filter(f => !have.has(fbKey(f))));
}

function poll() {   // one at a time: a slow answer must not pile up requests
  return inflight ??= (async () => {
    try {
      const [a, b] = await Promise.all([fetch(`/records?since=${rev}&boot=${boot}`, {cache: "no-store"}),
                                        fetch("/state", {cache: "no-store"})]);
      const d = await a.json();
      st = await b.json();
      merge(d);
      boot = d.boot; rev = d.rev;
      skew = st.now - Date.now();
      online = true;
    } catch {
      online = false;
    } finally {
      inflight = null;
    }
    render();
  })();
}

// after sending something: wait out a poll that started before it, then fetch again
async function refresh() { await inflight; await poll(); }

$("#power").addEventListener("click", () => setPaused(!st.paused));
$("#help-toggle").addEventListener("click", () => {
  $("#help-form").hidden = !$("#help-form").hidden;
  if (!$("#help-form").hidden) $("#help-note").focus();
});
$("#help-cancel").addEventListener("click", () => { $("#help-form").hidden = true; $("#help-note").value = ""; });
$("#help-form").addEventListener("submit", async e => {
  e.preventDefault();
  const s = currentSession();
  if (!s) { toast("No session yet, so there's nothing to attach this to."); return; }
  const any = recs.decisions.find(r => r.session_id === s);
  const ok = await sendFeedback(s, any && any.contract_version, "wanted_help", null, $("#help-note").value.trim());
  if (ok) { $("#help-form").hidden = true; $("#help-note").value = ""; await refresh(); }
  toast(ok ? "Logged as a miss. That's how I learn when to speak." : "Couldn't reach the server, so that wasn't logged.");
});

// Inside VS Code this page sits in a sandboxed iframe that can't open tabs,
// so ask the host (surface_webview.js) to open the restraint log instead.
if (params.has("embed") && window.parent !== window)
  document.querySelector(".foot a").addEventListener("click", e => {
    e.preventDefault();
    window.parent.postMessage({type: "big-brother:open", url: new URL("/", location.href).href}, "*");
  });

poll();
setInterval(poll, 1500);
setInterval(expireIgnored, 15000);
</script>
</body>
</html>
