<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restraint Log</title>
<style>
:root{
  --bg:#f6f5f1; --panel:#ffffff; --ink:#1d1c19; --muted:#6d6b64; --line:#e3e1da; --soft:#efede7;
  --quiet:#b4b1a7; --speak:#dd5a2b; --speak-soft:#fbe7de;
  --accepted:#2e8f57; --dismissed:#7d7b74; --ignored:#bdbab1;
  --bad_timing:#c98a12; --bad_content:#7b5cd1; --wanted_help:#cf3a3a;
  --ok:#2e8f57;
  --mono:ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#151513; --panel:#1e1e1b; --ink:#ecebe6; --muted:#9c9a92; --line:#302f2b; --soft:#282723;
    --quiet:#5f5d56; --speak:#f07a4a; --speak-soft:#3a2219;
    --accepted:#4cc07d; --dismissed:#9a988f; --ignored:#5a5852;
    --bad_timing:#e0a93a; --bad_content:#9d83ea; --wanted_help:#ef5b5b; --ok:#4cc07d;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:22px;margin:0;letter-spacing:-.01em}
h2{font-size:13px;margin:0;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.sub{margin:2px 0 0;color:var(--muted)}
button{font:inherit;color:inherit}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.controls{display:flex;gap:12px;align-items:center}
select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.live{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--quiet)}
.live.on i{background:var(--ok)} .live.off i{background:var(--wanted_help)}

.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat .n{font-size:24px;font-weight:650;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--muted)}
.stat.spoke .n{color:var(--speak)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.card-head{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;margin-bottom:6px}
.card-head .btn{margin-left:auto}
.legend{display:flex;gap:6px 12px;flex-wrap:wrap;color:var(--muted);font-size:12px;flex-basis:100%;order:3}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c)}
.legend i.bar{width:3px;height:12px;border-radius:2px}

.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 11px;cursor:pointer}
.btn:hover:not(:disabled){background:var(--soft)}
.btn:disabled{opacity:.5;cursor:default}
.btn.miss{border-color:var(--wanted_help);color:var(--wanted_help);font-weight:600}

.track{position:relative;height:132px;--base:80px;margin:10px 8px 0}
.baseline{position:absolute;left:0;right:0;top:var(--base);height:1px;background:var(--line)}
.tick{position:absolute;top:0;height:100%;width:14px;margin-left:-7px;border:0;background:none;padding:0;cursor:pointer;border-radius:6px}
.tick .bar{position:absolute;left:6px;width:2px;height:24px;bottom:calc(100% - var(--base));background:var(--quiet);border-radius:2px}
.tick.spoke .bar{left:5px;width:4px;height:58px;background:var(--speak)}
.tick.spoke .bar::before{content:"";position:absolute;top:-5px;left:-3px;width:10px;height:10px;border-radius:50%;background:var(--speak)}
.tick:hover .bar{filter:brightness(.8)}
.tick.sel{background:var(--soft)}
.tick .fb{position:absolute;left:3px;width:8px;height:8px;border-radius:50%;background:var(--c)}
.miss-line{position:absolute;top:0;bottom:0;border-left:2px dashed var(--wanted_help)}
.miss-line span{position:absolute;bottom:0;left:4px;font-size:11px;font-weight:600;color:var(--wanted_help);white-space:nowrap}
.miss-line.flip span{left:auto;right:6px}
.axis{position:relative;height:18px;margin:4px 8px 0;font:11px var(--mono);color:var(--muted)}
.axis span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.axis span:first-child{transform:none} .axis span:last-child{transform:translateX(-100%)}
.empty{color:var(--muted);text-align:center;padding:40px 0;margin:0}

.split{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;margin-top:14px;align-items:start}
.list{list-style:none;margin:10px 0 0;padding:0;max-height:620px;overflow:auto}
.row{display:grid;grid-template-columns:auto auto 1fr;gap:4px 10px;align-items:baseline;width:100%;text-align:left;border:0;background:none;padding:9px 8px;border-radius:8px;cursor:pointer;border-top:1px solid var(--line)}
.list li:first-child .row{border-top-color:transparent}
.row:hover{background:var(--soft)} .row.sel{background:var(--soft)}
.time{font:12px var(--mono);color:var(--muted)}
.badge{font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--soft);color:var(--muted)}
.badge.spoke{background:var(--speak-soft);color:var(--speak)}
.badge.big{font-size:13px;padding:3px 10px}
.why{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.why strong{font-weight:600}
.chips{grid-column:3;display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:11px;font-weight:600;color:var(--c);border:1px solid var(--c);border-radius:99px;padding:0 7px}

#detail .ph{color:var(--muted);margin:0}
.d-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.said{margin:0 0 14px;padding:10px 12px;border-left:3px solid var(--speak);background:var(--speak-soft);border-radius:0 8px 8px 0}
.said code,.why code{font-family:var(--mono);font-size:.92em}
.sec{margin-top:14px}
.sec > h2{margin-bottom:6px}
.sec p{margin:0}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:14px 0 0}
.facts dt{color:var(--muted)} .facts dd{margin:0}
.conf{display:inline-flex;align-items:center;gap:8px}
.meter{height:5px;border-radius:3px;background:var(--soft);overflow:hidden;width:90px}
.meter i{display:block;height:100%;background:var(--ink);opacity:.55}
.signals{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.sig-top{display:flex;align-items:center;gap:8px}
.sig-kind{font-weight:600}
.cited{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:0 6px}
.sig-n{margin-left:auto;font:12px var(--mono);color:var(--muted)}
.signals .meter{width:100%;margin:4px 0}
.sig-detail{color:var(--muted);font-size:13px}
.fb-list{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:6px}
.fb-list li{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.fb-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.fb-actions .btn{border-color:var(--c);color:var(--c);font-size:13px}
.note{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 10px}
.err{color:var(--wanted_help);font-size:13px;margin-top:6px}

@media (max-width:860px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .split{grid-template-columns:1fr}
  #detail{order:-1}
}
@media (max-width:600px){
  .axis span:nth-child(2n){display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Restraint log</h1>
      <p class="sub">Every moment the judge considered, and whether it spoke.</p>
    </div>
    <div class="controls">
      <select id="session" aria-label="Session" hidden></select>
      <span id="live" class="live"><i></i><span>Connecting…</span></span>
    </div>
  </header>

  <section class="stats" id="stats"></section>

  <section class="card">
    <div class="card-head">
      <h2>Timeline</h2>
      <div class="legend">
        <span><i class="bar" style="--c:var(--speak)"></i>Spoke</span>
        <span><i class="bar" style="--c:var(--quiet)"></i>Stayed quiet</span>
        <span><i style="--c:var(--accepted)"></i>Accepted</span>
        <span><i style="--c:var(--dismissed)"></i>Dismissed</span>
        <span><i style="--c:var(--ignored)"></i>Ignored</span>
        <span><i style="--c:var(--bad_timing)"></i>Bad timing</span>
        <span><i style="--c:var(--bad_content)"></i>Bad content</span>
        <span><i style="--c:var(--wanted_help)"></i>Missed</span>
      </div>
      <button id="wanted" class="btn miss" disabled>I wanted help just now</button>
    </div>
    <div class="track" id="track"></div>
    <div class="axis" id="axis"></div>
  </section>

  <main class="split">
    <section class="card">
      <h2>Moments</h2>
      <ol class="list" id="list"></ol>
    </section>
    <aside class="card" id="detail"></aside>
  </main>
</div>

<script>
const $ = s => document.querySelector(s);
const FB = {accepted:"Accepted", dismissed:"Dismissed", ignored:"Ignored",
            bad_timing:"Bad timing", bad_content:"Bad content", wanted_help:"Wanted help"};
const SPOKEN_FEEDBACK = ["accepted", "dismissed", "bad_timing", "bad_content", "ignored"];

let data = {decisions: [], feedback: []};
let session = null, selected = null, lastSig = "";

function el(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "style") n.style.cssText = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null && c !== false) n.append(c.nodeType ? c : String(c));
  return n;
}
const human = s => s ? s.replace(/_/g, " ").replace(/^./, c => c.toUpperCase()) : "—";
const clock = ms => new Date(ms).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit", second: "2-digit"});
const hhmm = ms => new Date(ms).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});

// Render `backticks` in model text as code, everything else as plain text.
function rich(text) {
  return (text || "").split(/(`[^`]+`)/).map(p =>
    p.startsWith("`") && p.endsWith("`") && p.length > 1 ? el("code", {}, p.slice(1, -1)) : p);
}

async function poll() {
  try {
    const r = await fetch("/records", {cache: "no-store"});
    data = await r.json();
    setLive(true);
  } catch {
    setLive(false);
    return;
  }
  const sig = data.decisions.length + ":" + data.feedback.length;
  if (sig !== lastSig) { lastSig = sig; render(); }
}

function setLive(ok) {
  const l = $("#live");
  l.className = "live " + (ok ? "on" : "off");
  l.lastElementChild.textContent = ok ? "Live" : "Server unreachable";
}

function render() {
  const latest = {};
  for (const r of data.decisions) latest[r.session_id] = Math.max(latest[r.session_id] || 0, r.decision.ts);
  for (const f of data.feedback) latest[f.session_id] = Math.max(latest[f.session_id] || 0, f.ts);
  const sessions = Object.keys(latest).sort((a, b) => latest[b] - latest[a]);
  if (!sessions.includes(session)) session = sessions[0] || null;

  const sel = $("#session");
  sel.replaceChildren(...sessions.map(s => el("option", {value: s, selected: s === session ? "" : null}, s)));
  sel.hidden = sessions.length < 2;

  const ds = data.decisions.filter(r => r.session_id === session).sort((a, b) => a.decision.ts - b.decision.ts);
  const fbs = data.feedback.filter(f => f.session_id === session);
  const byDec = {};
  for (const f of fbs) if (f.decision_id) (byDec[f.decision_id] ||= []).push(f);
  const misses = fbs.filter(f => !f.decision_id);
  if (selected && !ds.some(r => r.decision.decision_id === selected)) selected = null;

  renderStats(ds, fbs, misses);
  renderTimeline(ds, byDec, misses);
  renderList(ds, byDec);
  renderDetail(ds.find(r => r.decision.decision_id === selected), byDec);
  $("#wanted").disabled = !session;
}

function renderStats(ds, fbs, misses) {
  const spoke = ds.filter(r => r.decision.should_speak).length;
  const quiet = ds.length - spoke;
  const b = ds.length ? ds[ds.length - 1].candidate.budget : null;
  const stat = (label, n, sub, cls) =>
    el("div", {class: "stat " + (cls || "")}, el("div", {class: "n"}, n), el("div", {class: "l"}, label + (sub ? " · " + sub : "")));
  $("#stats").replaceChildren(
    stat("Moments", ds.length, "considered"),
    stat("Spoke", spoke, null, "spoke"),
    stat("Stayed quiet", quiet, ds.length ? Math.round(quiet / ds.length * 100) + "%" : null),
    stat("Budget left", b ? `${b.remaining}/${b.per_hour}` : "—", "this hour"),
    stat("Feedback", fbs.length, misses.length ? `${misses.length} missed` : null),
  );
}

function renderTimeline(ds, byDec, misses) {
  const track = $("#track"), axis = $("#axis");
  if (!ds.length && !misses.length) {
    track.replaceChildren(el("p", {class: "empty"}, "No moments yet. Waiting for the judge to call log()."));
    axis.replaceChildren();
    return;
  }
  const times = [...ds.map(r => r.decision.ts), ...misses.map(f => f.ts)];
  let t0 = Math.min(...times), t1 = Math.max(...times);
  if (t1 - t0 < 60000) { const mid = (t0 + t1) / 2; t0 = mid - 30000; t1 = mid + 30000; }
  const pad = (t1 - t0) * 0.03; t0 -= pad; t1 += pad;
  const x = t => ((t - t0) / (t1 - t0) * 100).toFixed(3) + "%";

  const nodes = [el("div", {class: "baseline"})];
  for (const m of misses)
    nodes.push(el("div", {class: "miss-line" + ((m.ts - t0) / (t1 - t0) > .85 ? " flip" : ""), style: `left:${x(m.ts)}`,
      title: `Wanted help · ${clock(m.ts)}${m.note ? " — " + m.note : ""}`}, el("span", {}, "missed")));
  for (const r of ds) {
    const d = r.decision, id = d.decision_id;
    const label = `${clock(d.ts)} · ${d.should_speak ? "Spoke" : "Stayed quiet: " + human(d.decline_reason)}`;
    nodes.push(el("button", {
        class: `tick ${d.should_speak ? "spoke" : "quiet"} ${id === selected ? "sel" : ""}`,
        style: `left:${x(d.ts)}`, title: label, "aria-label": label, onclick: () => pick(id)},
      el("i", {class: "bar"}),
      (byDec[id] || []).map((f, i) =>
        el("b", {class: "fb", style: `--c:var(--${f.kind});top:calc(var(--base) + ${8 + i * 11}px)`}))));
  }
  track.replaceChildren(...nodes);
  axis.replaceChildren(...[0, .25, .5, .75, 1].map(p => {
    const t = t0 + (t1 - t0) * p;
    return el("span", {style: `left:${p * 100}%`}, hhmm(t));
  }));
}

function renderList(ds, byDec) {
  if (!ds.length) { $("#list").replaceChildren(el("li", {class: "empty"}, "Nothing yet.")); return; }
  $("#list").replaceChildren(...[...ds].reverse().map(r => {
    const d = r.decision, fb = byDec[d.decision_id] || [];
    return el("li", {}, el("button", {class: `row ${d.decision_id === selected ? "sel" : ""}`, onclick: () => pick(d.decision_id)},
      el("span", {class: "time"}, clock(d.ts)),
      el("span", {class: `badge ${d.should_speak ? "spoke" : ""}`}, d.should_speak ? "Spoke" : "Quiet"),
      el("span", {class: "why"},
        el("strong", {}, d.should_speak ? human(d.trajectory) : human(d.decline_reason)), " · ", rich(d.reasoning)),
      fb.length ? el("span", {class: "chips"},
        fb.map(f => el("span", {class: "chip", style: `--c:var(--${f.kind})`}, FB[f.kind] || f.kind))) : null));
  }));
}

function renderDetail(r, byDec) {
  const box = $("#detail");
  if (!r) {
    box.replaceChildren(el("h2", {}, "Moment"),
      el("p", {class: "ph", style: "margin-top:10px"}, "Pick a moment on the timeline to see why the judge spoke or stayed quiet."));
    return;
  }
  const d = r.decision, c = r.candidate, fb = byDec[d.decision_id] || [];
  const cited = new Set(d.signals_cited || []);
  const sec = (title, ...body) => el("div", {class: "sec"}, el("h2", {}, title), ...body);
  const fact = (k, v) => [el("dt", {}, k), el("dd", {}, v)];

  box.replaceChildren(
    el("div", {class: "d-head"},
      el("span", {class: `badge big ${d.should_speak ? "spoke" : ""}`}, d.should_speak ? "Spoke" : "Stayed quiet"),
      el("span", {class: "time"}, clock(d.ts))),
    d.should_speak && d.content ? el("blockquote", {class: "said"}, rich(d.content)) : null,
    sec("Why", el("p", {}, rich(d.reasoning))),
    el("dl", {class: "facts"},
      fact("Trajectory", human(d.trajectory)),
      fact("Confidence", el("span", {class: "conf"},
        el("span", {class: "meter"}, el("i", {style: `width:${Math.round(d.confidence * 100)}%`})),
        Math.round(d.confidence * 100) + "%")),
      d.should_speak ? null : fact("Held back", human(d.decline_reason)),
      fact("Budget", `${c.budget.remaining}/${c.budget.per_hour} left`),
      d.latency_ms != null ? fact("Latency", `${d.latency_ms} ms`) : null,
      fact("Prompt", d.prompt_version || "—")),
    sec(`Signals (${c.signals.length})`, el("ul", {class: "signals"}, c.signals.map(s => el("li", {},
      el("div", {class: "sig-top"},
        el("span", {class: "sig-kind"}, human(s.kind)),
        cited.has(s.kind) ? el("span", {class: "cited"}, "cited") : null,
        el("span", {class: "sig-n"}, s.occurrences > 1 ? `×${s.occurrences}` : "")),
      el("div", {class: "meter"}, el("i", {style: `width:${Math.round(s.strength * 100)}%`})),
      el("p", {class: "sig-detail"}, s.detail))))),
    sec("Feedback", feedbackBlock(d, fb)));
}

function feedbackBlock(d, fb) {
  const list = fb.length ? el("ul", {class: "fb-list"}, fb.map(f => el("li", {},
    el("span", {class: "chip", style: `--c:var(--${f.kind})`}, FB[f.kind] || f.kind),
    el("span", {class: "time"}, clock(f.ts)),
    f.note ? el("span", {}, f.note) : null))) : null;
  if (!d.should_speak)
    return el("div", {}, list,
      el("p", {class: "ph"}, "The judge stayed quiet here. If you wanted help, press “I wanted help just now”."));

  const note = el("input", {class: "note", placeholder: "Note (optional)", "aria-label": "Feedback note"});
  const err = el("div", {class: "err"});
  const buttons = SPOKEN_FEEDBACK.map(kind => el("button", {class: "btn", style: `--c:var(--${kind})`,
    onclick: async e => {
      buttons.forEach(b => b.disabled = true);
      const ok = await sendFeedback(kind, d.decision_id, note.value.trim() || null);
      if (!ok) { err.textContent = "Couldn't reach the server."; buttons.forEach(b => b.disabled = false); }
    }}, FB[kind]));
  return el("div", {}, list, note, el("div", {class: "fb-actions"}, buttons), err);
}

async function sendFeedback(kind, decisionId, note) {
  const any = data.decisions.find(r => r.session_id === session);
  const rec = {contract_version: any ? any.contract_version : "1.0.0", session_id: session,
               ts: Date.now(), decision_id: decisionId, kind, note};
  try {
    const r = await fetch("/log", {method: "POST", headers: {"Content-Type": "application/json"},
                                   body: JSON.stringify(rec)});
    if (!r.ok) return false;
  } catch { return false; }
  await poll();
  return true;
}

function pick(id) { selected = id; render(); }

$("#session").addEventListener("change", e => { session = e.target.value; selected = null; render(); });
$("#wanted").addEventListener("click", async e => {
  e.target.disabled = true;
  const note = prompt("What did you want help with? (optional)");
  if (note !== null) await sendFeedback("wanted_help", null, note.trim() || null);
  e.target.disabled = !session;
});

render();
poll();
setInterval(poll, 2000);
</script>
</body>
</html>
